name: Update feeds
on:
  schedule:
    - cron: '23 */3 * * *'
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      bootstrap:
        type: boolean
        default: false
        description: Allow missing feeds on the initial deployment
      reset:
        type: boolean
        default: false
        description: Reset feeds and regenerate all items with new discovery times
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: feeds-pages
  cancel-in-progress: false
jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    environment:
      name: github-pages
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m unittest discover -s tests -v
      - uses: actions/configure-pages@v5
        id: pages
      - name: Generate feeds
        env:
          BASE_URL: ${{ steps.pages.outputs.base_url }}
          BOOTSTRAP: ${{ inputs.bootstrap || false }}
          RESET: ${{ inputs.reset || false }}
        run: |
          args=()
          if [ "$BOOTSTRAP" = "true" ]; then args+=(--bootstrap); fi
          if [ "$RESET" = "true" ]; then args+=(--reset); fi
          python -m feeds --base-url "$BASE_URL" "${args[@]}"
      - uses: actions/upload-pages-artifact@v3
        with:
          path: output
      - uses: actions/deploy-pages@v4
      - name: Report source warnings
        run: |
          python - <<'PYTHON'
          import json
          import os
          from pathlib import Path

          status_feed = json.loads(Path('output/status.json').read_text())
          status = json.loads(status_feed['items'][0]['content_text'])
          for failure in status['failures']:
              message = failure.replace('%', '%25').replace('\r', '%0D').replace('\n', '%0A')
              print('::warning::' + message)
          count = status['source_errors']
          summary = f'Feeds deployed successfully. Source errors recorded in feeds: {count}.\n'
          for slug, count in status['feed_items'].items():
              message = f'{slug}: {count} content items published'
              print('::notice::' + message)
              summary += f'\n- {message}'
          Path(os.environ['GITHUB_STEP_SUMMARY']).write_text(summary)
          PYTHON
